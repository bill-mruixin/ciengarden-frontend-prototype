      Object.assign(this.ap, { cust: null, byCert: null, selAssets: [], chains: {}, custItems: [], sealPic: null, sealMatched: false, err: '', q: '' });
    },
    identify() {
      const q = this.ap.q.trim().toUpperCase();
      this.ap.err = '';
      if (!q) { this.ap.err = '請輸入' + (this.ap.tab === 'id' ? '身分證字號' : '權狀號碼'); return; }
      if (this.ap.tab === 'id') {
        const c = ZN.CUSTOMERS.find(x => x.idNo === q);
        if (c) this.setCust(c, null); else { this.ap.cust = null; this.ap.err = '查無符合條件的資料，請確認身分證字號是否正確'; }
      } else {
        const a = ZN.ASSETS.find(x => x.certNo.toUpperCase() === q);
        if (a) this.setCust(ZN.customerOf(a.owner), a.certNo); else { this.ap.cust = null; this.ap.err = '查無符合條件的資料，請確認權狀號碼是否正確'; }
      }
    },
    scanSealCard() {
      this.ap.busy = true; this.ap.sealPic = ZN.fakePhoto('印鑑卡'); this.ap.sealMatched = false;
      setTimeout(() => { this.ap.busy = false; this.ap.sealMatched = true; this.setCust(ZN.CUSTOMERS[1], null); }, 900);
    },

    /* ② 資產與手續：每張權狀一條「辦理順序鏈」（同後台 5.3.1：排在前面者先辦理，只能從尾端新增／刪除，中間可原地更換） */
    item(code) { return ZN.APPLY_ITEMS.find(i => i.code === code); },
    assetList() {
      if (!this.ap.cust) return [];
      return this.ap.byCert ? [ZN.assetByCert(this.ap.byCert)] : ZN.assetsOf(this.ap.cust.id);
    },
    chosenAssets() { return this.assetList().filter(a => this.ap.selAssets.includes(a.certNo)); },
    chainOf(no) { return this.ap.chains[no] || []; },
    seqMark(n) { return '①②③④⑤⑥⑦⑧⑨⑩'[n - 1] || n; },
    chainText(no) { return this.chainOf(no).map((n, i) => this.seqMark(i + 1) + this.item(n.code).name).join(' → '); },
    toggleAsset(a) {
      if (a.lockedBy) { this.toast('此位置目前已被鎖定，無法建立申請單（' + a.lockedBy + '）', 'error'); return; }
      const no = a.certNo, i = this.ap.selAssets.indexOf(no);
      if (i >= 0) { this.ap.selAssets.splice(i, 1); delete this.ap.chains[no]; }
      else { this.ap.selAssets.push(no); this.ap.chains[no] = []; }
    },
    /* 權狀可選項目（不含客戶層級） */
    chainItems(type) { return ZN.itemsFor(type).filter(it => !ZN.ITEM_RULES.custLevel.includes(it.code)); },
    /* 第 idx 格放 code 是否可行；回傳不可選原因 */
    slotBlock(a, chain, idx, code) {
      const it = this.item(code), R = ZN.ITEM_RULES.notAfter;
      if (chain.some((n, j) => j !== idx && n.code === code)) return '已在順序中';
      const before = chain.slice(0, idx).map(n => n.code), after = chain.slice(idx + 1).map(n => n.code);
      const hit = (R[code] || []).find(c => before.includes(c));
      if (hit) return `前面已有「${this.item(hit).name}」`;
      const hit2 = after.find(c => (R[c] || []).includes(code));
      if (hit2) return `後面的「${this.item(hit2).name}」不可接在此項之後`;
      if (a && it.needUsed && a.usage !== '已使用') return `需已使用（目前${a.usage}）`;
      return '';
    },
    slotOptions(a, idx) {
      const chain = this.chainOf(a.certNo);
      const ch = idx < chain.length ? chain : chain.concat({ code: '' });
      return this.chainItems(a.type).map(it => ({ code: it.code, name: it.name, why: this.slotBlock(a, ch, idx, it.code) }));
    },
    applyAutos(a, chain) {
      const A = ZN.ITEM_RULES.autoAfter, B = ZN.ITEM_RULES.autoBefore;
      const ci = chain.findIndex(n => n.code === B.trigger);
      if (ci >= 0 && !chain.some(n => n.code === B.add) && this.chainItems(a.type).some(i => i.code === B.add)) chain.splice(ci, 0, { code: B.add, auto: true });
      if (a.type === '塔位' && a.usage === '已使用' && !chain.some(n => n.code === A.add)) {
        const ti = chain.map(n => A.trigger.includes(n.code)).lastIndexOf(true);
        if (ti >= 0) chain.splice(ti + 1, 0, { code: A.add, auto: true });
      }
      return chain;
    },
    addTail(a, code) {
      if (!code) return;
      const chain = this.chainOf(a.certNo).slice();
      const why = this.slotBlock(a, chain.concat({ code }), chain.length, code);
      if (why) { this.toast(why, 'error'); return; }
      chain.push({ code, auto: false });
      this.ap.chains[a.certNo] = this.applyAutos(a, chain);
    },
    changeAt(a, idx, code) {
      const chain = this.chainOf(a.certNo).slice(), old = chain[idx].code;
      if (code === old) return;
      const why = this.slotBlock(a, chain, idx, code);
      if (why) { this.toast(why, 'error'); this.ap.chains[a.certNo] = chain; return; }
      chain[idx] = { code, auto: false };
      if (old === ZN.ITEM_RULES.autoBefore.trigger) { const g = chain.findIndex(n => n.code === ZN.ITEM_RULES.autoBefore.add && n.auto); if (g >= 0) chain.splice(g, 1); }
      this.ap.chains[a.certNo] = this.applyAutos(a, chain);
    },
    removeTail(a) {
      const chain = this.chainOf(a.certNo).slice(), last = chain.pop();
      const B = ZN.ITEM_RULES.autoBefore, prev = chain[chain.length - 1];
      if (last && last.code === B.trigger && prev && prev.code === B.add && prev.auto) chain.pop();
      this.ap.chains[a.certNo] = chain;
    },
    /* 批次異動：同一條順序套用到所有勾選權狀 */
    batchOptions(idx) {
      const types = [...new Set(this.chosenAssets().map(a => a.type))], ch = this.ap.batch.chain;
      const c2 = idx < ch.length ? ch : ch.concat({ code: '' });
      return ZN.APPLY_ITEMS.filter(it => !ZN.ITEM_RULES.custLevel.includes(it.code) && types.every(t => this.chainItems(t).includes(it)))
        .map(it => ({ code: it.code, name: it.name, why: this.slotBlock(null, c2, idx, it.code) }));
    },
    openBatch() { this.ap.batch = { open: true, chain: [] }; },
    batchAdd(code) {
      const o = this.batchOptions(this.ap.batch.chain.length).find(x => x.code === code);
      if (!o || o.why) return;
      this.ap.batch.chain.push({ code, auto: false });
    },
    applyBatch() {
      const skipped = [];
      this.chosenAssets().forEach(a => {
        const ch = this.ap.batch.chain.filter(n => {
          const ok = this.chainItems(a.type).some(i => i.code === n.code) && !(this.item(n.code).needUsed && a.usage !== '已使用');
          if (!ok) skipped.push(a.certNo + ' ' + this.item(n.code).name);
          return ok;
        }).map(n => ({ ...n }));
        this.ap.chains[a.certNo] = this.applyAutos(a, ch);
      });
      this.ap.batch.open = false;
      this.toast(skipped.length ? '已套用；未使用的位置略過：' + skipped.join('、') : '已套用至 ' + this.ap.selAssets.length + ' 張權狀');
    },
    /* 客戶層級異動 */
    custLevelItems() { return ZN.ITEM_RULES.custLevel.map(c => this.item(c)); },
    validCertCount() { return ZN.assetsOf(this.ap.cust.id).filter(a => a.usage !== '遷出').length; },
    custBlock(it) {
      if (!this.validCertCount()) return '名下無有效權狀';
      const ex = ZN.ITEM_RULES.custExclusive.find(g => g.includes(it.code));
      const other = ex && ex.find(c => c !== it.code && this.ap.custItems.includes(c));
      return other ? `與「${this.item(other).name}」不可同時辦理` : '';
    },
    toggleCust(it) {
      const i = this.ap.custItems.indexOf(it.code);
      if (i >= 0) { this.ap.custItems.splice(i, 1); return; }
      const b = this.custBlock(it); if (b) { this.toast(b, 'error'); return; }
      this.ap.custItems.push(it.code);
    },
    emptyChains() { return this.ap.selAssets.filter(no => !this.chainOf(no).length); },
    /* 後續步驟用：依「權狀 → 順序」展開的辦理清單；客戶層級排最後 */
    sections() {
      const out = [];
      this.chosenAssets().forEach(a => this.chainOf(a.certNo).forEach((n, i) =>
        out.push({ key: a.certNo + '|' + n.code, cert: a.certNo, asset: a, seq: i + 1, auto: n.auto, it: this.item(n.code) })));
      this.ap.custItems.forEach(c => out.push({ key: 'CUST|' + c, cert: null, asset: null, seq: 0, auto: false, it: this.item(c) }));
      return out;
    },
    selectedItems() { const seen = new Set(); return this.sections().map(x => x.it).filter(it => !seen.has(it.code) && seen.add(it.code)); },
    hasSplit() { return this.sections().some(x => ['A01', 'A02'].includes(x.it.code)); },

    /* ③ 印鑑 */
    takeSealPhoto() { this.ap.sealPhoto = ZN.fakeSeal(this.ap.cust.seal); },

    /* ④ 填寫資料 */
    initForms() {
      const mk = () => ({ name: '', idNo: '', phone: '', addr: '', relation: '' });
      const dt = () => ({ y: '', m: '', d: '' });
      this.sections().forEach(sec => {
        const it = sec.it;
        if (this.ap.form[sec.key]) return;
        const f = {};
        (it.fields || []).forEach(fld => {
          if (this.personFields.includes(fld)) f[fld] = mk();
          else if (fld === '新位置') f.newPos = '';
          else if (fld === '換裝方式') f.refit = '';
          else if (fld === '往生者') f.dec = { name: '', birth: dt(), death: dt(), enshrine: dt(), hour: '' };
          else if (fld === '新姓名') f.newName = '';
          else if (fld === '牌位內容') f.tablet = '';
          else if (fld === '新名條內容') f.plate = '';
        });
        this.ap.form[sec.key] = f;
        this.ap.openSec[sec.key] = true;
      });
    },
    shoot(key, label) { this.ap.photos[key] = ZN.fakePhoto(label); },
    /* 同一手續、前面權狀已填 → 可一鍵帶入 */
    prevSame(sec) {
      const all = this.sections(), at = all.findIndex(y => y.key === sec.key);
      return all.slice(0, at).reverse().find(x => x.cert && x.it.code === sec.it.code);
    },
    copyFrom(sec) {
      const p = this.prevSame(sec); if (!p) return;
      this.ap.form[sec.key] = JSON.parse(JSON.stringify(this.ap.form[p.key]));
      (sec.it.docs || []).forEach(d => { if (this.ap.photos[p.key + '|' + d]) this.ap.photos[sec.key + '|' + d] = this.ap.photos[p.key + '|' + d]; });
      if (this.ap.photos['seal|' + p.key]) this.ap.photos['seal|' + sec.key] = this.ap.photos['seal|' + p.key];
      this.ap.openSec[sec.key] = false; this.$nextTick(() => { this.ap.openSec[sec.key] = true; });
      this.toast('已帶入 ' + p.cert + ' 的資料');
    },
    itemErrors(sec) {
      const it = sec.it, e = [], f = this.ap.form[sec.key]; if (!f) return e;
      (it.fields || []).forEach(fld => {
        if (this.personFields.includes(fld)) {
          const p = f[fld];
          if (!p.name) e.push(`${fld}姓名`); if (!p.idNo) e.push(`${fld}身分證號`);
          if (!p.phone) e.push(`${fld}電話`); if (!p.relation) e.push(`${fld}關係`);
        } else if (fld === '新位置' && !f.newPos) e.push('新位置');
        else if (fld === '換裝方式' && !f.refit) e.push('換裝方式');
        else if (fld === '往生者') {
          if (!f.dec.name) e.push('往生者姓名');
          const d = f.dec.death; if (!d.y || !d.m || !d.d) e.push('死亡日期');
        } else if (fld === '新姓名' && !f.newName) e.push('新姓名');
        else if (fld === '新印鑑' && !this.ap.photos['seal|' + sec.key]) e.push('新印鑑照片');
        else if (fld === '牌位內容' && !f.tablet) e.push('牌位內容');
        else if (fld === '新名條內容' && !f.plate) e.push('新名條內容');
      });
      (it.docs || []).forEach(d => { if (!this.ap.photos[sec.key + '|' + d]) e.push(d); });
      return e;
    },
    secLabel(sec) { return sec.cert ? `${sec.cert} ${this.seqMark(sec.seq)}${sec.it.name}` : `客戶資料 ${sec.it.name}`; },
    step4Errors() { return this.sections().flatMap(sec => this.itemErrors(sec).map(m => this.secLabel(sec) + '：' + m)); },
    rocStr(o) { return o && o.y ? `民國 ${o.y} 年 ${o.m} 月 ${o.d} 日` : '—'; },

    /* ⑤ 費用 */
    feeRows() {
      const rows = [], inh = {};
      this.sections().forEach(sec => {
        const it = sec.it, a = sec.asset;
        const row = { cert: sec.cert || '客戶資料', seq: sec.seq ? this.seqMark(sec.seq) : '—', name: it.name, auto: sec.auto, rule: it.feeRule, amt: it.fee };
        if (it.code === 'A02') {
          /* 繼承：依「繼承人 × 被繼承人」分組，每 5 張一級距，金額記在該組第一筆，其餘 0 */
          const heir = ((this.ap.form[sec.key] || {})['繼承人'] || {}).name || '（未填繼承人）';
          const g = inh[heir] || (inh[heir] = { n: 0, first: row });
          g.n++; row.amt = 0; row.rule = `併入「${heir}」組第一筆計算`;
        } else if (it.code === 'B03') {
          const n = this.validCertCount(), g = Math.ceil(n / 10);
          row.amt = it.fee * g; row.rule = `名下有效權狀 ${n} 張，每 10 張 ${ZN.money(it.fee)} × ${g}`;
        } else if (it.key === 'tablet_engrave') {
          const sp = /^(A11|B3R|B6)/.test(a.pos || '');
          row.amt = sp ? 1000 : 2000; row.rule = sp ? '特定區域（A11/B3R/B6）1,000 元' : '一般區域 2,000 元';
        }
        rows.push(row);
      });
      Object.entries(inh).forEach(([heir, g]) => { const k = Math.ceil(g.n / 5); g.first.amt = 1000 * k; g.first.rule = `繼承人「${heir}」共 ${g.n} 張，每 5 張 1,000 元 × ${k}`; });
      return rows;
    },
    total() { return this.feeRows().reduce((s, r) => s + r.amt, 0); },

    /* ⑥ 摘要 */
    summaryLines(sec) {
      const it = sec.it, f = this.ap.form[sec.key] || {}, L = [];
      (it.fields || []).forEach(fld => {
        if (this.personFields.includes(fld)) { const p = f[fld]; L.push(`${fld}：${p.name}（${p.relation}）　身分證 ${ZN.maskId(p.idNo)}　電話 ${p.phone}${p.addr ? '　地址 ' + p.addr : ''}`); }
        else if (fld === '被繼承人') L.push(`被繼承人：${this.ap.cust.name}（目前持有人）`);
        else if (fld === '新位置') L.push('新位置：' + f.newPos);
        else if (fld === '換裝方式') L.push('換裝方式：' + f.refit);
        else if (fld === '往生者') L.push(`往生者：${f.dec.name}　死亡 ${this.rocStr(f.dec.death)}　預定晉塔 ${this.rocStr(f.dec.enshrine)} ${f.dec.hour}`);
        else if (fld === '新姓名') L.push('新姓名：' + f.newName);
        else if (fld === '新印鑑') L.push('新印鑑：已拍攝');
        else if (fld === '牌位內容') L.push('牌位內容：' + f.tablet);
        else if (fld === '新名條內容') L.push('新名條內容：' + f.plate);
      });
      if ((it.docs || []).length) L.push(`已附文件：${it.docs.join('、')}`);
      if (!L.length) L.push('無需額外填寫資料');
      return L;
    },
    enterCust() { this.ap.custMode = true; this.ap.agree = false; this.ap.signed = false; window.scrollTo(0, 0); },
    exitCust() { this.ap.custMode = false; this.ap.agree = false; this.ap.signed = false; },

    /* 步驟流程 */
    canNext() {
      if (this.ap.step === 1) return !!this.ap.cust;
      if (this.ap.step === 2) return this.sections().length > 0 && this.emptyChains().length === 0;
      return true;
    },
    prev() { if (this.ap.step > 1) { this.ap.step--; window.scrollTo(0, 0); } },
    next() {
      if (!this.canNext()) return;
      if (this.ap.step === 3 && !this.ap.sealPhoto) return;
      if (this.ap.step === 4) {
        if (this.step4Errors().length) { this.ap.showErr = true; this.toast('請先完成必填資料（紅色標示）', 'error'); window.scrollTo(0, 0); return; }
      }
      const to = this.ap.step + 1;
      if (to === 4) this.initForms();
      this.ap.step = to; window.scrollTo(0, 0);
    },
    submitApply() {
      if (!(this.ap.signed && this.ap.agree)) return;
      this.appSeq++;
      const no = 'APP-' + todayISO().replace(/-/g, '') + '-0' + pad2(this.appSeq);
      const items = this.selectedItems();
      this.ap.appNo = no; this.ap.paid = this.total();
      this.ap.submittedAt = ZN.roc(new Date()) + ' ' + pad2(new Date().getHours()) + ':' + pad2(new Date().getMinutes());
      this.apps.push({ no, owner: this.ap.cust.id, date: todayISO(), items: items.map(i => i.name), certs: [...this.ap.selAssets], chains: JSON.parse(JSON.stringify(this.ap.chains)), custItems: [...this.ap.custItems], status: '待會計審核', sign: '免簽收', fee: this.ap.paid });
      this.ap.custMode = false; this.ap.done = true; window.scrollTo(0, 0);
    },

    /* ====================================================
       4. 資料領取與簽收
       ==================================================== */
    startReceive() { this.rcv = newRcv(); this.go('receive'); },
    receiveList() {
      const q = this.rcv.q.trim().toLowerCase();
      return this.apps.filter(a => {
        if (!q) return true;
        const c = ZN.customerOf(a.owner);
        return a.no.toLowerCase().includes(q) || (c && (c.name.includes(q) || c.idNo.toLowerCase().includes(q)));
      });
    },
    signBadge(a) { return a.sign === '已簽收' ? ZN.badge('已簽收') : a.sign === '未簽收' ? 'zn-badge zn-badge-orange' : 'zn-badge zn-badge-gray'; },
    selectApp(a) {
      this.rcv.sel = null; this.rcv.who = 'self'; this.rcv.agentName = ''; this.rcv.agentPhoto = null; this.rcv.signed = false;
      this.$nextTick(() => { this.rcv.sel = a; });
    },
    canReceive() {
      const r = this.rcv;
      return r.signed && (r.who === 'self' || (r.agentName.trim() && r.agentPhoto));
    },
    doReceive() {
      const a = this.rcv.sel;
      a.sign = '已簽收'; a.signedAt = todayISO();
      this.toast('已完成簽收：' + a.no);
      this.selectApp(a);
    },

    /* ====================================================
       5. 存放證掃描
       ==================================================== */
    startScan() { this.scn = newScn(); this.go('scan'); },
    simScan(valid) {
      this.scn.phase = 'scanning';
      setTimeout(() => {
        if (valid) { this.scn.asset = ZN.assetByCert('VIP1140803'); this.scn.phase = 'valid'; }
        else this.scn.phase = 'invalid';
      }, 1000);
    },
    createVisit() {
      const d = new Date();
      this.scn.recNo = 'VST-20261103-0' + pad2(10 + Math.floor(Math.random() * 80));
      this.scn.at = ZN.roc(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      this.scn.phase = 'done';
      this.toast('已建立到訪紀錄');
    },

    /* ====================================================
       6. 會員帳號綁定
       ==================================================== */
    startBind() { this.bd = newBd(); this.go('bind'); },
    bindFindCust() {
      const q = this.bd.idq.trim().toUpperCase(); this.bd.err = ''; this.bd.checked = false;
      const c = ZN.CUSTOMERS.find(x => x.idNo === q);
      if (c) this.bd.cust = c; else { this.bd.cust = null; this.bd.err = '查無符合條件的資料，請確認身分證字號'; }
    },
    bindFindMember() {
      const q = this.bd.memq.trim().toLowerCase(); this.bd.err = ''; this.bd.mem = null;
      if (!q) { this.bd.err = '請輸入手機、Email 或 LINE User ID'; return; }
      const m = ZN.MEMBERS.find(x => x.login.toLowerCase() === q || (x.login.toLowerCase().replace('...', '') && q.startsWith(x.login.toLowerCase().replace('...', '')) && x.via === 'LINE'));
      if (!m) { this.bd.err = '查無符合條件的資料，請確認線上帳號'; return; }
      if (m.status !== '待綁定') { this.bd.err = `此帳號狀態為「${m.status}」，已完成綁定，無法重複綁定。`; return; }
      this.bd.mem = m;
    },
    doBind() {
      this.bd.mem.status = '已啟用'; this.bd.mem.customer = this.bd.cust.id;
      if (this.bd.mem.via === 'LINE') this.bd.cust.lineBound = true;
      this.bd.done = true;
      this.toast('已發送綁定成功通知（LINE/簡訊/Email）');
    },
  };
}
</script>
</body>
</html>
