<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/theme.css"><link rel="icon" href="../assets/img/favicon.ico">
<script src="../assets/mock.js"></script><script src="../assets/common.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<title>慈恩園 會員專區</title>
<style>
  /* 桌機：底部導覽與內容同寬，置中 */
  .zn-tabbar { max-width: 28rem; margin: 0 auto; }
  .zn-tabbar button { min-height: 3.5rem; }
  .line-btn { background: #06C755; color: #fff; border: 0; }
  .line-btn:hover { background: #05a847; }
  input[type=number]::-webkit-inner-spin-button { display: none; }
  .modal-box { max-width: 28rem; }
  /* ---- RWD ---- */
  @media (min-width: 640px) { .zn-tabbar { max-width: 42rem; } }
  @media (min-width: 1024px) {
    #app section.zn-fade { max-width: 68rem; margin-left: auto; margin-right: auto; padding: 2rem 2rem 0; }
    #app section.zn-fade.narrow { max-width: 44rem; }
    #app .is-auth section.zn-fade { max-width: 32rem; padding-top: 4rem; }
    #app .is-auth header.sticky { background: transparent; border-bottom: 0; }
  }
  .side-nav button { display: flex; align-items: center; gap: .875rem; width: 100%; min-height: 3.5rem; padding: 0 1.25rem; border-radius: .875rem; font-size: 1.125rem; font-weight: 600; color: var(--zn-ink-2); text-align: left; transition: background .15s; }
  .side-nav button:hover { background: #f1f5f9; }
  .side-nav button.is-on { background: var(--zn-primary-soft); color: var(--zn-primary-deep); }
</style>
</head>
<body>

<div id="app" x-data="memberApp()" x-cloak>

  <!-- 桌機背景：模糊外觀照 -->
  <div class="hidden md:block fixed inset-0 overflow-hidden z-0" aria-hidden="true">
    <div class="absolute inset-0" style="background:url(../assets/img/hero.jpg) center/cover;filter:blur(22px);transform:scale(1.12);opacity:.55"></div>
  </div>

  <!-- 雛形切換（右上，低調） -->
  <div class="fixed top-2 right-2 z-50" @click.outside="demoOpen=false">
    <button type="button" class="h-8 px-3 rounded-full bg-white/80 backdrop-blur border border-slate-200 text-xs text-slate-500 flex items-center gap-1" @click="demoOpen=!demoOpen">
      <span class="inline-flex"><i data-lucide="flask-conical" class="w-3.5 h-3.5"></i></span> 雛形切換
    </button>
    <div x-show="demoOpen" x-transition class="absolute right-0 mt-1 w-60 max-w-[calc(100vw-1rem)] bg-white rounded-xl shadow-lg border border-slate-200 p-1">
      <button type="button" class="w-full text-left px-3 h-12 rounded-lg hover:bg-slate-50 text-base" :class="demo==='guest'&&'bg-sky-50 font-bold'" @click="setDemo('guest')">未登入</button>
      <button type="button" class="w-full text-left px-3 h-12 rounded-lg hover:bg-slate-50 text-base" :class="demo==='pending'&&'bg-sky-50 font-bold'" @click="setDemo('pending')">待綁定會員（M00058）</button>
      <button type="button" class="w-full text-left px-3 h-12 rounded-lg hover:bg-slate-50 text-base" :class="demo==='active'&&'bg-sky-50 font-bold'" @click="setDemo('active')">已啟用會員（王大明 C0001024）</button>
    </div>
  </div>

  <!-- 手機寬度欄位 -->
  <!-- 桌機：左側導覽（已登入）／左側照片（登入、註冊） -->
  <aside class="hidden lg:flex fixed inset-y-0 left-0 w-64 z-30 flex-col bg-white border-r border-slate-200 p-4" x-show="showTabbar">
    <div class="zn-brand px-2 py-3 mb-4"><span class="zn-brand-mark">慈</span>慈恩園 會員專區</div>
    <nav class="side-nav space-y-1" aria-label="主選單">
      <button type="button" :class="activeTab==='home' && 'is-on'" @click="tab('home')"><span class="inline-flex"><i data-lucide="house" class="w-6 h-6"></i></span><span>首頁</span></button>
      <button type="button" :class="activeTab==='assets' && 'is-on'" @click="tab('assets')"><span class="relative inline-flex"><i data-lucide="map-pin" class="w-6 h-6"></i><span x-show="isPending" class="absolute -top-1 -right-2 bg-white rounded-full text-amber-600 inline-flex"><i data-lucide="lock" class="w-3.5 h-3.5"></i></span></span><span>我的位置</span></button>
      <button type="button" :class="activeTab==='cert' && 'is-on'" @click="tab('cert')"><span class="relative inline-flex"><i data-lucide="qr-code" class="w-6 h-6"></i><span x-show="isPending" class="absolute -top-1 -right-2 bg-white rounded-full text-amber-600 inline-flex"><i data-lucide="lock" class="w-3.5 h-3.5"></i></span></span><span>存放證</span></button>
      <button type="button" :class="activeTab==='pay' && 'is-on'" @click="tab('pay')"><span class="relative inline-flex"><i data-lucide="wallet" class="w-6 h-6"></i><span x-show="isPending" class="absolute -top-1 -right-2 bg-white rounded-full text-amber-600 inline-flex"><i data-lucide="lock" class="w-3.5 h-3.5"></i></span></span><span>繳費</span></button>
      <button type="button" :class="activeTab==='me' && 'is-on'" @click="tab('me')"><span class="inline-flex"><i data-lucide="user" class="w-6 h-6"></i></span><span>我的</span></button>
    </nav>
    <p class="mt-auto px-2 text-sm text-slate-500">服務專線 <span x-text="ZN.SITE.tel"></span></p>
  </aside>
  <div class="hidden lg:block fixed inset-y-0 left-0 w-[45%] z-20 overflow-hidden" x-show="!showTabbar" aria-hidden="true">
    <img src="../assets/img/hero.jpg" alt="" class="w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(15,40,60,.15),rgba(15,40,60,.75))"></div>
    <div class="absolute bottom-0 left-0 right-0 p-10 text-white">
      <div class="zn-brand text-white"><span class="zn-brand-mark">慈</span>慈恩園</div>
      <p class="mt-3 text-2xl font-bold tracking-wide">會員專區</p>
      <p class="mt-1 text-lg text-white/85">查詢名下位置、出示數位存放證、線上回報管理費繳費。</p>
    </div>
  </div>

  <!-- 內容欄：手機窄欄、平板置中、桌機滿版（含左側導覽） -->
  <div class="relative z-10 w-full max-w-md sm:max-w-2xl lg:max-w-none mx-auto min-h-screen bg-[#f3f6f9] md:shadow-2xl lg:shadow-none" :class="[showTabbar ? 'pb-28 lg:pb-10 lg:pl-64' : 'pb-10 lg:pl-[45%] is-auth']">

    <!-- 頁首：sticky 白底，子頁有返回鍵 -->
    <header class="sticky top-0 z-30 bg-white border-b border-slate-200 grid items-center" style="grid-template-columns:3.5rem 1fr 3.5rem;min-height:3.5rem" x-show="view!=='welcome'">
      <div>
        <button type="button" class="w-14 h-14 grid place-items-center text-slate-600" x-show="isSub" @click="back()" aria-label="返回">
          <span class="inline-flex"><i data-lucide="chevron-left" class="w-7 h-7"></i></span>
        </button>
      </div>
      <h1 class="text-center text-xl font-bold" x-text="titles[view]"></h1>
      <div></div>
    </header>

    <!-- ===== 畫面 1：歡迎／登入選擇 ===== -->
    <template x-if="screen==='welcome'">
      <section class="zn-fade">
        <div class="relative h-72 overflow-hidden lg:hidden">
          <img src="../assets/img/hero.jpg" alt="慈恩園外觀" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-[#f3f6f9]"></div>
        </div>
        <div class="px-5 -mt-14 lg:mt-0 relative">
          <div class="zn-brand-mark !w-14 !h-14 !text-2xl shadow-lg mb-3">慈</div>
          <h1 class="text-3xl font-extrabold tracking-wide">慈恩園 會員專區</h1>
          <p class="mt-2 text-slate-600">查詢名下位置、出示數位存放證、線上回報管理費繳費，在家就能辦。</p>

          <div class="mt-6 space-y-3">
            <button type="button" class="btn btn-lg w-full line-btn" @click="loginLine()">
              <span class="inline-flex"><i data-lucide="message-circle" class="w-6 h-6"></i></span> 使用 LINE 登入
            </button>
            <button type="button" class="btn btn-lg btn-primary w-full" @click="openLogin('phone')">
              <span class="inline-flex"><i data-lucide="smartphone" class="w-6 h-6"></i></span> 手機號碼登入
            </button>
            <button type="button" class="btn btn-lg btn-soft w-full" @click="openLogin('email')">
              <span class="inline-flex"><i data-lucide="mail" class="w-6 h-6"></i></span> Email 登入
            </button>
          </div>

          <p class="text-center mt-6 text-lg">
            還沒有帳號？<button type="button" class="font-bold underline text-[#2f7fae] min-h-[48px] px-1" @click="openRegister()">立即註冊</button>
          </p>
          <p class="text-center zn-hint mt-2">服務專線 <span x-text="ZN.SITE.tel"></span></p>
        </div>
      </section>
    </template>

    <!-- ===== 畫面 1b：手機／Email 登入 ===== -->
    <template x-if="screen==='login'">
      <section class="zn-fade px-4 pt-5 space-y-4">
        <div class="zn-card zn-card-pad space-y-5">
          <h2 class="text-2xl font-bold" x-text="loginMode==='phone' ? '手機號碼登入' : 'Email 登入'"></h2>
          <div>
            <label class="zn-label" x-text="loginMode==='phone' ? '手機號碼' : 'Email'"></label>
            <input class="input input-lg w-full" x-model="loginId" :type="loginMode==='phone' ? 'tel' : 'email'" :inputmode="loginMode==='phone' ? 'numeric' : 'email'" autocomplete="username" :placeholder="loginMode==='phone' ? '例如 0912345678' : 'name@example.com'">
          </div>
          <div>
            <label class="zn-label">密碼</label>
            <div class="relative">
              <input class="input input-lg w-full pr-14" x-model="loginPwd" :type="showPwd ? 'text' : 'password'" autocomplete="current-password">
              <button type="button" class="absolute right-0 top-0 w-14 h-full grid place-items-center text-slate-500" @click="showPwd=!showPwd" aria-label="顯示或隱藏密碼">
                <span x-show="!showPwd" class="inline-flex"><i data-lucide="eye" class="w-6 h-6"></i></span>
                <span x-show="showPwd" class="inline-flex"><i data-lucide="eye-off" class="w-6 h-6"></i></span>
              </button>
            </div>
          </div>
          <p class="zn-error-text" x-show="loginErr" x-text="loginErr"></p>
          <button type="button" class="btn btn-xl btn-primary w-full" @click="doLogin()">登入</button>
          <p class="zn-hint text-center">示範帳號已幫您填好，直接按「登入」即可。</p>
        </div>
        <div class="text-center space-y-1">
          <button type="button" class="font-bold underline text-[#2f7fae] min-h-[48px]" @click="openLogin(loginMode==='phone' ? 'email' : 'phone')" x-text="loginMode==='phone' ? '改用 Email 登入' : '改用手機號碼登入'"></button><br>
          <button type="button" class="font-bold underline text-[#2f7fae] min-h-[48px]" @click="openRegister()">還沒有帳號？立即註冊</button>
        </div>
      </section>
    </template>

    <!-- ===== 畫面 2：註冊（無 OTP，MEMB-003） ===== -->
    <template x-if="screen==='register'">
      <section class="zn-fade px-4 pt-5 space-y-4">
        <!-- 步驟條 -->
        <div class="zn-steps px-1">
          <div class="zn-step" :class="stepCls(1)"><span class="zn-step-dot" x-text="reg.step>1 ? '✓' : '1'"></span><span x-show="reg.step===1">選擇方式</span></div>
          <div class="zn-step-line" :class="reg.step>1 && 'is-done'"></div>
          <div class="zn-step" :class="stepCls(2)"><span class="zn-step-dot" x-text="reg.step>2 ? '✓' : '2'"></span><span x-show="reg.step===2">填寫資料</span></div>
          <div class="zn-step-line" :class="reg.step>2 && 'is-done'"></div>
          <div class="zn-step" :class="stepCls(3)"><span class="zn-step-dot">3</span><span x-show="reg.step===3">完成</span></div>
        </div>

        <!-- 步驟 1：選擇方式 -->
        <div x-show="reg.step===1" class="space-y-3">
          <h2 class="text-2xl font-bold">您想用哪種方式註冊？</h2>
          <button type="button" class="zn-choice w-full text-left" :class="reg.method==='line' && 'is-on'" @click="reg.method='line'">
            <span class="zn-tile-icon !bg-green-50 !text-[#06C755] shrink-0"><i data-lucide="message-circle" class="w-7 h-7"></i></span>
            <span class="flex-1"><b class="text-xl block">LINE 帳號</b><span class="zn-hint">最快，不用另外記密碼</span></span>
            <span class="zn-check"><span x-show="reg.method==='line'">✓</span></span>
          </button>
          <button type="button" class="zn-choice w-full text-left" :class="reg.method==='phone' && 'is-on'" @click="reg.method='phone'">
            <span class="zn-tile-icon shrink-0"><i data-lucide="smartphone" class="w-7 h-7"></i></span>
            <span class="flex-1"><b class="text-xl block">手機號碼</b><span class="zn-hint">用手機號碼加密碼登入</span></span>
            <span class="zn-check"><span x-show="reg.method==='phone'">✓</span></span>
          </button>
          <button type="button" class="zn-choice w-full text-left" :class="reg.method==='email' && 'is-on'" @click="reg.method='email'">
            <span class="zn-tile-icon shrink-0"><i data-lucide="mail" class="w-7 h-7"></i></span>
            <span class="flex-1"><b class="text-xl block">Email</b><span class="zn-hint">用電子郵件加密碼登入</span></span>
            <span class="zn-check"><span x-show="reg.method==='email'">✓</span></span>
          </button>
          <button type="button" class="btn btn-lg btn-primary w-full mt-2" :disabled="!reg.method" @click="reg.step=2; reg.tried=false">下一步</button>
        </div>

        <!-- 步驟 2：填寫資料 -->
        <div x-show="reg.step===2" class="zn-card zn-card-pad space-y-5">
          <h2 class="text-2xl font-bold">請填寫基本資料</h2>
          <div class="zn-note zn-note-info">
            <span class="shrink-0 inline-flex"><i data-lucide="info" class="w-6 h-6"></i></span>
            <span>註冊<b>不需要</b>簡訊驗證碼，填完直接送出即可。</span>
          </div>
          <div x-show="reg.method==='line'" class="zn-note zn-note-success">
            <span class="shrink-0 inline-flex"><i data-lucide="check-circle-2" class="w-6 h-6"></i></span>
            <span>已取得 LINE 授權（示範）。請再確認您的姓名。</span>
          </div>
          <div>
            <label class="zn-label"><span class="req">*</span>姓名</label>
            <input class="input input-lg w-full" x-model="reg.name" placeholder="請輸入真實姓名" autocomplete="name">
            <p class="zn-error-text" x-show="reg.tried && regErr.name" x-text="regErr.name"></p>
          </div>
          <div x-show="reg.method!=='line'">
            <label class="zn-label"><span class="req">*</span><span x-text="reg.method==='phone' ? '手機號碼' : 'Email'"></span></label>
            <input class="input input-lg w-full" x-model="reg.contact" :type="reg.method==='phone' ? 'tel' : 'email'" :inputmode="reg.method==='phone' ? 'numeric' : 'email'" :placeholder="reg.method==='phone' ? '例如 0912345678' : 'name@example.com'">
            <p class="zn-error-text" x-show="reg.tried && regErr.contact" x-text="regErr.contact"></p>
          </div>
          <div x-show="reg.method!=='line'">
            <label class="zn-label"><span class="req">*</span>設定密碼</label>
            <input class="input input-lg w-full" type="password" x-model="reg.pwd" autocomplete="new-password" placeholder="至少 8 個字">
            <p class="zn-error-text" x-show="reg.tried && regErr.pwd" x-text="regErr.pwd"></p>
          </div>
          <div x-show="reg.method!=='line'">
            <label class="zn-label"><span class="req">*</span>再輸入一次密碼</label>
            <input class="input input-lg w-full" type="password" x-model="reg.pwd2" autocomplete="new-password">
            <p class="zn-error-text" x-show="reg.tried && regErr.pwd2" x-text="regErr.pwd2"></p>
          </div>
          <div>
            <label class="zn-choice" :class="reg.agree && 'is-on'">
              <input type="checkbox" class="checkbox checkbox-primary w-7 h-7 mt-1" x-model="reg.agree">
              <span class="flex-1">我已閱讀並同意<button type="button" class="underline font-bold text-[#2f7fae]" @click.prevent="sheet='privacy'">個人資料蒐集與使用告知</button></span>
            </label>
            <p class="zn-error-text" x-show="reg.tried && regErr.agree" x-text="regErr.agree"></p>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" class="btn btn-lg btn-ghost-gray" @click="reg.step=1">上一步</button>
            <button type="button" class="btn btn-lg btn-primary" @click="submitRegister()">送出註冊</button>
          </div>
        </div>

        <!-- 步驟 3：完成 -->
        <div x-show="reg.step===3" class="space-y-4">
          <div class="text-center py-2">
            <div class="w-20 h-20 mx-auto rounded-full bg-green-100 text-green-600 grid place-items-center"><i data-lucide="check" class="w-12 h-12"></i></div>
            <h2 class="text-2xl font-bold mt-3">註冊完成</h2>
            <p class="mt-1">帳號狀態：<span :class="ZN.badge('待綁定')">待綁定</span></p>
          </div>
          <div class="zn-card zn-card-pad">
            <h3 class="zn-section-title mb-4">接下來請這樣做</h3>
            <ol class="space-y-5">
              <li class="flex gap-3">
                <span class="w-10 h-10 rounded-full bg-green-100 text-green-700 grid place-items-center font-bold text-xl shrink-0">①</span>
                <div><p class="font-bold text-lg">已完成線上註冊</p><p class="zn-hint">您的帳號已建立。</p></div>
              </li>
              <li class="flex gap-3">
                <span class="w-10 h-10 rounded-full bg-[#61b0db] text-white grid place-items-center font-bold text-xl shrink-0">②</span>
                <div class="flex-1">
                  <p class="font-bold text-lg">攜帶身分證正本至服務處臨櫃綁定</p>
                  <div class="zn-note zn-note-info mt-2 !p-3 text-base"><div>
                    <p><b><span x-text="ZN.SITE.service"></span></b></p>
                    <p>時間：<span x-text="ZN.SITE.hours"></span></p>
                    <p>地址：<span x-text="ZN.SITE.addr"></span></p>
                    <p>電話：<a class="underline font-bold" :href="'tel:'+ZN.SITE.tel" x-text="ZN.SITE.tel"></a></p>
                  </div></div>
                </div>
              </li>
              <li class="flex gap-3">
                <span class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 grid place-items-center font-bold text-xl shrink-0">③</span>
                <div><p class="font-bold text-lg">綁定完成即可查看名下資產</p><p class="zn-hint">位置、存放證、管理費都能在手機上看。</p></div>
              </li>
            </ol>
          </div>
          <button type="button" class="btn btn-lg line-btn w-full" @click="toast('示範：已開啟 LINE 官方帳號加入頁')">
            <span class="inline-flex"><i data-lucide="bell-ring" class="w-6 h-6"></i></span> 加入 LINE 官方帳號接收通知
          </button>
          <button type="button" class="btn btn-lg btn-primary w-full" @click="finishRegister()">進入會員專區</button>
        </div>
      </section>
    </template>

    <!-- ===== 畫面 3：待綁定首頁 ===== -->
    <template x-if="screen==='pendingHome'">
      <section class="narrow zn-fade px-4 pt-5 space-y-4">
        <div class="zn-card zn-card-pad">
          <p class="text-2xl font-bold" x-text="(member.lineName || '會員') + ' 您好'"></p>
          <p class="mt-2">帳號狀態：<span :class="ZN.badge('待綁定')">待綁定</span></p>
          <p class="zn-hint mt-1">完成臨櫃綁定後，才能查看名下資產。</p>
        </div>

        <div class="zn-card zn-card-pad">
          <h3 class="zn-section-title mb-4">接下來請這樣做</h3>
          <ol class="space-y-5">
            <li class="flex gap-3">
              <span class="w-10 h-10 rounded-full bg-green-100 text-green-700 grid place-items-center font-bold text-xl shrink-0">①</span>
              <div><p class="font-bold text-lg">已完成線上註冊</p></div>
            </li>
            <li class="flex gap-3">
              <span class="w-10 h-10 rounded-full bg-[#61b0db] text-white grid place-items-center font-bold text-xl shrink-0">②</span>
              <div class="flex-1">
                <p class="font-bold text-lg">攜帶身分證正本至服務處臨櫃綁定</p>
                <div class="zn-note zn-note-info mt-2 !p-3 text-base"><div>
                  <p><b x-text="ZN.SITE.service"></b></p>
                  <p>時間：<span x-text="ZN.SITE.hours"></span></p>
                  <p>地址：<span x-text="ZN.SITE.addr"></span></p>

            <p class="zn-hint">轉帳後，請回到這裡按「我已轉帳，回報繳費」。</p>

              <div class="flex items-center justify-between gap-2">
                <b class="text-lg" x-text="b.item + '・' + b.period"></b>
                <span :class="ZN.badge(b.status)" x-text="b.status"></span>
              </div>
              <p class="text-2xl font-extrabold" x-text="ZN.money(b.amount)"></p>

              <p class="text-base" x-show="b.status==='已繳費'">繳費日期：民國 <b x-text="ZN.roc(b.paidAt)"></b></p>
              <template x-if="b.status==='對帳中' && b.report">
                <div class="zn-note zn-note-info !p-3 text-base">
                  <span>已回報：末五碼 <b x-text="b.report.last5"></b>，轉帳日 民國<span x-text="ZN.roc(b.report.date)"></span>。會計確認入帳後將以 LINE／簡訊通知您。</span>
                </div>
              </template>
            </div>
          </template>
          <div class="zn-card zn-card-pad text-center text-slate-500 lg:col-span-2" x-show="!historyBills.length">還沒有繳費紀錄</div>
        </div>
      </section>
    </template>

    <!-- ===== 畫面 7b：回報繳費表單 ===== -->
    <template x-if="screen==='payReport'">
      <section class="narrow zn-fade px-4 pt-5 space-y-4">

        <div x-show="reportDone" class="space-y-4">

              <input class="input input-lg w-full tracking-widest font-mono" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="例如 12345" x-model="f.last5" @input="f.last5=$event.target.value.replace(/\D/g,'').slice(0,5)">

                <div class="flex items-center justify-between"><dt class="text-slate-500">身分證</dt><dd class="font-bold flex items-center gap-2"><span x-text="ZN.maskId(cust.idNo)"></span><span class="text-slate-400 inline-flex"><i data-lucide="lock" class="w-4 h-4"></i></span></dd></div>

    <button type="button" :class="activeTab==='assets' && 'is-on'" @click="tab('assets')">
      <span class="relative inline-flex"><i data-lucide="map-pin" class="w-6 h-6"></i><span x-show="isPending" class="absolute -top-1 -right-2 bg-white rounded-full text-amber-600 inline-flex"><i data-lucide="lock" class="w-3.5 h-3.5"></i></span></span><span>我的位置</span>
    </button>

      <span class="relative inline-flex"><i data-lucide="qr-code" class="w-6 h-6"></i><span x-show="isPending" class="absolute -top-1 -right-2 bg-white rounded-full text-amber-600 inline-flex"><i data-lucide="lock" class="w-3.5 h-3.5"></i></span></span><span>存放證</span>

  <!-- 底部彈出：異動說明／個資告知 -->
  <div class="modal modal-bottom sm:modal-middle" :class="sheet && 'modal-open'" style="z-index:70">
    <div class="modal-box max-h-[85vh]">
      <template x-if="sheet==='change' && d">

          <h3 class="text-2xl font-bold">我要辦理異動</h3>
          <div class="zn-note zn-note-warn">
            <span class="shrink-0 inline-flex"><i data-lucide="building-2" class="w-6 h-6"></i></span>
            <span>異動需<b>臨櫃辦理</b>，請攜帶<b>印鑑</b>與<b>身分證件</b>。本頁僅供參考，無法線上送出。</span>
          </div>
          <div class="zn-note zn-note-info text-base">
            <div>
              <p><b x-text="ZN.SITE.service"></b></p>
              <p x-text="ZN.SITE.hours"></p>
              <p x-text="ZN.SITE.addr"></p>
              <p>電話：<span x-text="ZN.SITE.tel"></span></p>
            </div>
          </div>
          <h4 class="zn-section-title">常見辦理項目（<span x-text="d.type"></span>）</h4>
          <ul class="divide-y divide-slate-100">
            <template x-for="it in ZN.itemsFor(d.type)" :key="it.code">
              <li class="py-3">
                <p class="font-bold text-lg" x-text="it.name"></p>
                <p class="text-base text-slate-600" x-text="it.desc"></p>
                <p class="text-sm text-[#8a6420]">規費：<span x-text="it.feeRule"></span></p>
                <p class="text-sm text-slate-500" x-show="it.needUsed">需已晉塔／安奉</p>
              </li>
            </template>
          </ul>
        </div>
      </template>
      <template x-if="sheet==='privacy'">
        <div class="space-y-3">
          <h3 class="text-2xl font-bold">個人資料蒐集與使用告知</h3>
          <p>慈恩園蒐集您的姓名與聯絡方式，僅用於會員身分確認、管理費與辦理進度通知，以及服務聯繫。</p>
          <p>您的資料不會提供與無關的第三方；您可隨時至服務處查詢、更正或請求刪除。</p>
          <p class="zn-hint">（雛形示意文字，正式內容以業主提供為準）</p>

        <button type="button" class="btn btn-lg btn-primary w-full" @click="sheet=null">我知道了</button>

    <div class="modal-backdrop" @click="sheet=null"></div>
  </div>

  <!-- 確認對話框 -->
  <div class="modal" :class="confirmBox.open && 'modal-open'" style="z-index:80">
    <div class="modal-box">
      <h3 class="text-2xl font-bold" x-text="confirmBox.title"></h3>

        <button type="button" class="btn btn-lg btn-primary" @click="confirmBox.open=false; confirmBox.fn && confirmBox.fn()" x-text="confirmBox.ok"></button>
      </div>

    <div class="modal-backdrop" @click="confirmBox.open=false"></div>

  <!-- Toast -->
  <div class="fixed top-16 inset-x-0 z-[100] flex flex-col items-center gap-2 px-4 pointer-events-none">
    <template x-for="t in $store.toast.items" :key="t.id">
      <div class="px-5 py-3 rounded-xl text-white shadow-lg text-base max-w-sm" :class="t.type==='error' ? 'bg-red-600' : 'bg-slate-800'" x-text="t.msg"></div>
    </template>
  </div>

  <div class="zn-proto-flag" style="bottom:5rem">雛形 Prototype · 會員專區</div>
</div>

<script>
/* 會員專區 Alpine 根元件：view（畫面）＋ member（登入會員） */
function memberApp() {
  const pad = n => String(n).padStart(2, '0');
  return {
    /* ---------- 狀態 ---------- */
    view: 'welcome',          // welcome login register home assets assetDetail cert pay payReport me
    member: null,             // null = 未登入
    demo: 'guest', demoOpen: false,
    titles: { welcome: '', login: '登入', register: '註冊會員', home: '首頁', assets: '我的位置', assetDetail: '資產詳情', cert: '數位存放證', pay: '繳費與回報', payReport: '回報繳費', me: '我的' },
    sheet: null,
    confirmBox: { open: false, title: '', msg: '', ok: '確定', fn: null },
    // 登入
    loginMode: 'phone', loginId: '0912345678', loginPwd: 'demo1234', showPwd: false, loginErr: '',
    // 註冊
    reg: { step: 1, method: '', name: '', contact: '', pwd: '', pwd2: '', agree: false, tried: false },
    regMember: null,
    // 資產
    assetFilter: '全部', detail: null, detailFrom: 'assets',
    // 存放證
    selCert: null, qrSrc: '', qrStamp: 0, left: 60,
    // 繳費
    bills: [], payTab: 'due', billSel: null, reportDone: false,
    f: { last5: '', date: '', amount: '', note: '', tried: false },
    // 個人資料
    pf: { phone: '', zip: '', addr: '', tried: false }, pfPending: null, lineBound: false,

    /* ---------- 初始化 ---------- */
    init() {
      setInterval(() => {
        if (this.view === 'cert' && this.certAssets.length) { this.left--; if (this.left <= 0) this.refreshQR(); }
      }, 1000);
      // 畫面變動後重畫 lucide 圖示（避免重複觸發：無 <i data-lucide> 時不改 DOM）
      let sched = false;
      new MutationObserver(() => {
        if (sched) return; sched = true;
        requestAnimationFrame(() => { sched = false; if (window.lucide) lucide.createIcons(); });
      }).observe(this.$root, { childList: true, subtree: true });
      this.$nextTick(() => window.lucide && lucide.createIcons());
    },

    /* ---------- 衍生資料 ---------- */
    get cust() { return this.member && this.member.customer ? ZN.customerOf(this.member.customer) : null; },
    get isPending() { return !!this.member && this.member.status === '待綁定'; },
    get isActive() { return !!this.member && this.member.status === '已啟用'; },
    get isSub() { return ['login', 'register', 'assetDetail', 'payReport'].includes(this.view); },
    get showTabbar() { return !!this.member && !['welcome', 'login', 'register'].includes(this.view); },
    get activeTab() {
      if (this.view === 'assetDetail') return this.detailFrom === 'cert' ? 'cert' : 'assets';
      if (this.view === 'payReport') return 'pay';
      return this.view;
    },
    // 實際顯示的畫面（待綁定時，資產／存放證／繳費上鎖）
    get screen() {
      if (!this.member && !['welcome', 'login', 'register'].includes(this.view)) return 'welcome';
      if (this.isPending) {
        if (this.view === 'home') return 'pendingHome';
        if (['assets', 'assetDetail', 'cert', 'pay', 'payReport'].includes(this.view)) return 'locked';
      }
      return this.view;
    },
    get memberQR() { return this.member ? ZN.fakeQR(this.member.id) : ''; },
    get assets() { return this.cust ? ZN.assetsOf(this.cust.id) : []; },
    get shownAssets() { return this.assetFilter === '全部' ? this.assets : this.assets.filter(a => a.type === this.assetFilter); },
    get d() { return this.detail && this.cust ? ZN.assetsOf(this.cust.id).find(a => a.certNo === this.detail) || null : null; },
    get certAssets() { return this.assets.filter(a => (a.type === '塔位' || a.type === '蓮位') && a.usage === '已使用'); },
    get curCert() { return this.certAssets.find(a => a.certNo === this.selCert) || this.certAssets[0]; },
    get dueBills() { return this.bills.filter(b => b.status === '待繳費'); },
    get historyBills() { return this.bills.filter(b => b.status !== '待繳費'); },
    get curBill() { return this.bills.find(b => b.id === this.billSel); },
    get apps() { return this.cust ? ZN.APPLICATIONS.filter(a => a.owner === this.cust.id).sort((a, b) => b.date.localeCompare(a.date)) : []; },
    get nextCeremony() { return ZN.CEREMONIES.filter(c => c.status === '報名中').sort((a, b) => a.date.localeCompare(b.date))[0]; },
    get regErr() {
      const r = this.reg, e = {};
      if (!r.name.trim()) e.name = '請輸入姓名';
      if (r.method === 'phone' && !/^09\d{8}$/.test(r.contact)) e.contact = '請輸入 10 碼手機號碼，例如 0912345678';
      if (r.method === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.contact)) e.contact = '請輸入正確的 Email';
      if (r.method !== 'line') {
        if (r.pwd.length < 8) e.pwd = '密碼至少 8 個字';
        if (r.pwd2 !== r.pwd || !r.pwd2) e.pwd2 = '兩次輸入的密碼不一樣';
      }
      if (!r.agree) e.agree = '請勾選同意後才能繼續';
      return e;
    },
    get fErr() {
      const f = this.f, e = {};
      if (!/^\d{5}$/.test(f.last5)) e.last5 = '請輸入 5 個數字';
      if (!f.date) e.date = '請選擇日期';
      else if (f.date > this.isoToday()) e.date = '日期不能是未來';
      if (!f.amount || Number(f.amount) <= 0) e.amount = '請輸入金額';
      return e;
    },
    get pfErr() {
      const p = this.pf, e = {};
      if (!/^(09\d{8}|0\d{1,2}-?\d{6,8})$/.test(p.phone.trim())) e.phone = '請輸入正確的電話號碼';
      if (!/^\d{3}(\d{2,3})?$/.test(p.zip.trim())) e.zip = '郵遞區號請輸入 3 碼數字';
      if (!p.addr.trim()) e.addr = '請輸入通訊地址';
      return e;
    },
    get pfChanged() { return this.cust && (this.pf.phone !== this.cust.phone || this.pf.zip !== this.cust.zip || this.pf.addr !== this.cust.addr); },

    /* ---------- 工具 ---------- */
    isoToday() { const t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); },
    toast(m, t) { Alpine.store('toast').show(m, t); },
    stepCls(n) { return this.reg.step === n ? 'is-active' : (this.reg.step > n ? 'is-done' : ''); },
    typeBadge(t) { return 'zn-badge ' + ({ 塔位: 'zn-badge-blue', 蓮位: 'zn-badge-purple', 禮儀: 'zn-badge-gold' }[t] || 'zn-badge-gray'); },
    usageBadge(u) { return 'zn-badge ' + ({ 已使用: 'zn-badge-green', 未使用: 'zn-badge-gray', 申請中: 'zn-badge-yellow', 遷出: 'zn-badge-red' }[u] || 'zn-badge-gray'); },
    countOf(f) { return f === '全部' ? this.assets.length : this.assets.filter(a => a.type === f).length; },
    billOf(certNo) { return this.dueBills.find(b => b.certNo === certNo); },
    ask(title, msg, ok, fn) { this.confirmBox = { open: true, title, msg, ok, fn }; },
    copy(text, label) {
      const ok = () => this.toast('已複製' + label);
      const fb = () => {
        const t = document.createElement('textarea');
        t.value = text; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(t); ok();
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },

    /* ---------- 導覽 ---------- */
    go(v) {
      this.view = v; this.sheet = null;
      if (v === 'cert') { if (!this.selCert && this.certAssets[0]) this.selCert = this.certAssets[0].certNo; this.refreshQR(); }
      window.scrollTo(0, 0);
    },
    tab(v) {
      if (this.isPending && v !== 'home' && v !== 'me') this.toast('需先完成臨櫃綁定才能使用', 'error');
      this.go(v);
    },
    back() {
      const m = { login: 'welcome', register: 'welcome', assetDetail: this.detailFrom || 'assets', payReport: 'pay' };
      this.go(m[this.view] || 'home');
    },

    /* ---------- 雛形切換 ---------- */
    setDemo(k) {
      this.demo = k; this.demoOpen = false;
      if (k === 'guest') { this.setMember(null); this.go('welcome'); }
      else { this.setMember(ZN.MEMBERS[k === 'pending' ? 1 : 0]); this.go('home'); }
    },
    setMember(m) {
      this.member = m ? { ...m } : null;
      this.demo = !m ? 'guest' : (m.status === '待綁定' ? 'pending' : 'active');
      const c = this.cust;
      this.bills = c ? ZN.FEE_BILLS.filter(b => b.owner === c.id).map(b => ({ ...b })) : [];
      this.pf = { phone: c ? c.phone : '', zip: c ? c.zip : '', addr: c ? c.addr : '', tried: false };
      this.pfPending = null; this.lineBound = c ? !!c.lineBound : false;
      this.selCert = null; this.detail = null; this.assetFilter = '全部'; this.payTab = 'due';
    },

    /* ---------- 登入 ---------- */
    openLogin(mode) {
      this.loginMode = mode; this.loginErr = ''; this.showPwd = false; this.loginPwd = 'demo1234';
      this.loginId = mode === 'phone' ? '0912345678' : 'hsiuying.lin@example.com';
      this.go('login');
    },
    loginLine() { this.setMember(ZN.MEMBERS[0]); this.toast('已用 LINE 登入'); this.go('home'); },
    doLogin() {
      const id = this.loginId.trim();
      if (!id || !this.loginPwd) { this.loginErr = '請輸入帳號和密碼'; return; }
      if (this.loginMode === 'phone' && !/^09\d{8}$/.test(id)) { this.loginErr = '手機號碼要 10 碼，例如 0912345678'; return; }
      if (this.loginMode === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id)) { this.loginErr = '請輸入正確的 Email'; return; }
      const m = ZN.MEMBERS.find(x => x.login === id) ||
        { id: 'M00099', login: id, via: this.loginMode === 'phone' ? '手機' : 'Email', customer: null, status: '待綁定' };
      this.setMember(m); this.toast('登入成功'); this.go('home');
    },
    askLogout() {
      this.ask('要登出嗎？', '登出後需要重新登入才能查看資料。', '登出', () => {
        this.setMember(null); this.go('welcome'); this.toast('已登出');
      });
    },

    /* ---------- 註冊（無 OTP） ---------- */
    openRegister() {
      this.reg = { step: 1, method: '', name: '', contact: '', pwd: '', pwd2: '', agree: false, tried: false };
      this.go('register');
    },
    submitRegister() {
      this.reg.tried = true;
      if (Object.keys(this.regErr).length) { this.toast('請先修正標紅的欄位', 'error'); return; }
      const r = this.reg;
      this.regMember = {
        id: 'M00' + (100 + Math.floor(Math.random() * 900)),
        login: r.method === 'line' ? 'LINE 使用者' : r.contact,
        via: { line: 'LINE', phone: '手機', email: 'Email' }[r.method],
        customer: null, status: '待綁定', lineName: r.name.trim(),
      };
      this.reg.step = 3; window.scrollTo(0, 0);
    },
    finishRegister() { this.setMember(this.regMember); this.go('home'); },

    /* ---------- 資產 ---------- */
    openAsset(certNo, from) { this.detail = certNo; this.detailFrom = from; this.go('assetDetail'); },

    /* ---------- 存放證 ---------- */
    selectCert(no) { this.selCert = no; this.refreshQR(); },
    refreshQR(manual) {
      if (!this.curCert) return;
      this.qrStamp = Date.now(); this.left = 60;
      this.qrSrc = ZN.fakeQR(this.curCert.certNo + '|' + this.qrStamp, 25);
      if (manual) this.toast('QR 碼已更新');
    },

    /* ---------- 繳費回報 ---------- */
    openReport(b) {
      this.billSel = b.id; this.reportDone = false;
      this.f = { last5: '', date: this.isoToday(), amount: String(b.amount), note: '', tried: false };
      this.go('payReport');
    },
    submitReport() {
      this.f.tried = true;
      if (Object.keys(this.fErr).length) { this.toast('請先修正標紅的欄位', 'error'); return; }
      this.ask('確定送出回報？', '末五碼 ' + this.f.last5 + '，金額 ' + ZN.money(Number(this.f.amount)) + '。送出後無法修改。', '確定送出', () => {
        const b = this.curBill;
        b.status = '對帳中';
        b.report = { last5: this.f.last5, date: this.f.date, amount: Number(this.f.amount), note: this.f.note };
        this.reportDone = true; window.scrollTo(0, 0);
      });
    },

    /* ---------- 個人資料 ---------- */
    submitProfile() {
      this.pf.tried = true;
      if (Object.keys(this.pfErr).length) { this.toast('請先修正標紅的欄位', 'error'); return; }
      this.pfPending = { phone: this.pf.phone.trim(), zip: this.pf.zip.trim(), addr: this.pf.addr.trim(), at: new Date() };
      this.toast('已送出，等待後台人員確認');
    },
  };
}
</script>
</body>
</html>
